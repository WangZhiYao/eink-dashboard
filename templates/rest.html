<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:800px; height:480px; }
  body {
    background:#a0a0a0; color:#0a0a0a;
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC",ui-sans-serif,system-ui,sans-serif;
    display:flex; flex-direction:column; gap:14px; padding:14px;
  }
  .imgwrap { flex:1; display:flex; align-items:center; justify-content:center; background:#ffffff; border-radius:7px; overflow:hidden; }
  .imgwrap img { max-width:100%; max-height:100%; object-fit:contain; }
  .txt { background:#ffffff; border-radius:7px; padding:12px 16px; text-align:center; }
  .date { font-size:20px; font-weight:700; }
  .holiday { font-size:34px; font-weight:800; letter-spacing:4px; margin-top:6px; }
  .rest { font-size:24px; font-weight:700; color:#5f5f5f; margin-top:6px; letter-spacing:8px; }
</style>
</head>
<body>
  {% if image %}
  <div class="imgwrap"><img src="{{ image }}"></div>
  {% endif %}
  <div class="txt">
    <div class="date">{{ weekday }} · {{ date_str }}{% if lunar %} · 农历{{ lunar }}{% endif %}</div>
    {% if day_name %}<div class="holiday">{{ day_name }}</div>{% endif %}
    <div class="rest">休 息 日</div>
  </div>
</body>
</html>
