<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EFF2F0">
<title>待办管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<style>
  :root{
    --primary:#006A6B; --on-primary:#ffffff; --primary-container:#9CF1F2; --on-primary-container:#002020;
    --secondary-container:#CFE4E1; --on-secondary-container:#003935;
    --tertiary-container:#CDE8CD; --on-tertiary-container:#0B2E10;
    --error:#B3261E; --error-container:#F9DEDC; --on-error-container:#410E0B;
    --surface:#F4F7F5; --on-surface:#181C1B; --on-surface-variant:#3F4947;
    --surface-container-low:#EFF2F0; --surface-container:#E9EDEB; --surface-container-high:#E3E7E5;
    --outline:#6F7977; --outline-variant:#BFC9C6;
    --e1:0 1px 2px rgba(0,0,0,.3),0 1px 3px 1px rgba(0,0,0,.15);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; font-family:"Roboto",system-ui,sans-serif;}
  body{margin:0; background:var(--surface-container-low); color:var(--on-surface); min-height:100vh;}
  .ms{font-family:'Material Symbols Outlined'; font-weight:400; font-style:normal; font-size:24px; line-height:1; letter-spacing:normal; text-transform:none; display:inline-block; white-space:nowrap; direction:ltr; font-feature-settings:'liga'; -webkit-font-smoothing:antialiased;}

  .appbar{position:sticky; top:0; z-index:5; background:var(--surface-container-low);
    padding:14px 20px; display:flex; align-items:center; gap:8px;}
  .appbar .title{font-size:22px; font-weight:500;}              /* title-large */
  .appbar .count{margin-left:auto; color:var(--on-surface-variant); font-size:13px;}

  .main{max-width:560px; margin:0 auto; padding:8px 16px 40px;}

  .addcard{background:var(--surface-container); border-radius:16px; padding:16px; margin:4px 0 8px;}
  .field{display:flex; align-items:center; border:1px solid var(--outline); border-radius:12px; transition:border-color .15s;}
  .field:focus-within{border-color:var(--primary);}
  .field input{flex:1; min-width:0; border:none; outline:none; background:transparent; font-size:16px; padding:14px 16px; color:var(--on-surface);}
  .field input::placeholder{color:var(--on-surface-variant);}

  .chips{display:flex; gap:8px; margin:14px 0 2px; flex-wrap:wrap;}
  .chip{border:1px solid var(--outline-variant); background:transparent; color:var(--on-surface-variant);
    border-radius:8px; padding:6px 12px; font-size:14px; font-weight:500; cursor:pointer;
    display:inline-flex; align-items:center; gap:7px; transition:background .15s,color .15s,border-color .15s;}
  .chip .dot{width:8px; height:8px; border-radius:50%;}
  .chip.high .dot{background:var(--error);}
  .chip.normal .dot{background:var(--outline);}
  .chip.low .dot{background:#4C663A;}
  .chip.sel{border-color:transparent;}
  .chip.sel.normal{background:var(--secondary-container); color:var(--on-secondary-container);}
  .chip.sel.high{background:var(--error-container); color:var(--on-error-container);}
  .chip.sel.low{background:var(--tertiary-container); color:var(--on-tertiary-container);}

  .rowbtn{display:flex; justify-content:flex-end; margin-top:14px;}
  .btn{background:var(--primary); color:var(--on-primary); border:none; border-radius:20px;
    height:40px; padding:0 24px; font-size:14px; font-weight:500; cursor:pointer;
    display:inline-flex; align-items:center; gap:8px; transition:box-shadow .15s,filter .1s;}
  .btn:hover{box-shadow:var(--e1);} .btn:active{filter:brightness(.94);}

  .sec{color:var(--on-surface-variant); font-size:12px; font-weight:500; letter-spacing:.4px; margin:18px 4px 2px;}

  ul{list-style:none; margin:0; padding:0;}
  .item{display:flex; align-items:center; gap:6px; padding:6px 8px; border-radius:16px; transition:background .12s;}
  .item:hover{background:var(--surface-container-high);}

  .m3cb{width:18px; height:18px; flex:0 0 auto; position:relative; margin:0 8px 0 4px; cursor:pointer;}
  .m3cb .box{width:18px; height:18px; border:2px solid var(--on-surface-variant); border-radius:2px; background:transparent; transition:all .12s;}
  .m3cb.on .box{background:var(--primary); border-color:var(--primary);}
  .m3cb.on .box::after{content:""; position:absolute; left:5px; top:1px; width:5px; height:9px;
    border:solid var(--on-primary); border-width:0 2px 2px 0; transform:rotate(45deg);}

  .itext{flex:1; min-width:0; font-size:16px; line-height:1.4; word-break:break-word; padding:10px 0;}
  .done .itext{color:var(--on-surface-variant); text-decoration:line-through;}
  .itag{font-size:11px; font-weight:500; padding:3px 8px; border-radius:6px; margin-right:2px; white-space:nowrap;}
  .itag.high{background:var(--error-container); color:var(--on-error-container);}
  .itag.normal{background:var(--surface-container-high); color:var(--on-surface-variant);}
  .itag.low{background:var(--tertiary-container); color:var(--on-tertiary-container);}

  .iconbtn{width:40px; height:40px; flex:0 0 auto; border-radius:50%; border:none; background:transparent;
    color:var(--on-surface-variant); cursor:pointer; display:inline-flex; align-items:center; justify-content:center; transition:background .12s;}
  .iconbtn:hover{background:var(--surface-container-high);}
  .iconbtn:active{background:var(--outline-variant);}

  .empty{text-align:center; padding:64px 0; color:var(--on-surface-variant);}
  .empty .ms{font-size:48px; opacity:.35; display:block; margin-bottom:8px;}

  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>
</head>
<body>
<div class="appbar">
  <span class="title">待办</span>
  <span class="count" id="count"></span>
</div>
<div class="main">
  <div class="addcard">
    <div class="field"><input type="text" id="title" placeholder="添加新待办…" autocomplete="off"></div>
    <div class="chips" id="chips">
      <button type="button" class="chip normal sel" data-prio="normal"><span class="dot"></span>普通</button>
      <button type="button" class="chip high" data-prio="high"><span class="dot"></span>紧要</button>
      <button type="button" class="chip low" data-prio="low"><span class="dot"></span>从容</button>
    </div>
    <div class="rowbtn"><button class="btn" id="add"><span class="ms" style="font-size:18px">add</span>添加</button></div>
  </div>

  <div class="sec">待办</div>
  <ul id="open"></ul>
  <div class="sec" id="donesec" style="display:none">已完成</div>
  <ul id="done"></ul>
  <div class="empty" id="empty" style="display:none">
    <span class="ms">check_circle</span>没有待办
  </div>
</div>

<script>
const NAMES = { high:"紧要", normal:"普通", low:"从容" };
let prio = "normal";

document.getElementById("chips").addEventListener("click", e => {
  const c = e.target.closest(".chip");
  if (!c) return;
  prio = c.dataset.prio;
  document.querySelectorAll("#chips .chip").forEach(x => x.classList.remove("sel"));
  c.classList.add("sel");
});

async function load(){
  const todos = await (await fetch("/api/todos?include_done=true")).json();
  const open = todos.filter(t => !t.done), done = todos.filter(t => t.done);
  document.getElementById("count").textContent = open.length ? `${open.length} 项` : "";
  document.getElementById("empty").style.display = todos.length ? "none" : "block";
  document.getElementById("open").innerHTML = open.map(render).join("");
  document.getElementById("donesec").style.display = done.length ? "block" : "none";
  document.getElementById("done").innerHTML = done.map(render).join("");
}
function render(t){
  return `<li class="item ${t.done ? "done" : ""}">
    <div class="m3cb ${t.done ? "on" : ""}" role="checkbox" aria-checked="${t.done}" tabindex="0"
         onclick="toggle(${t.id}, ${!t.done})"
         onkeydown="if(event.key===' '||event.key==='Enter'){event.preventDefault();toggle(${t.id}, ${!t.done})}"><div class="box"></div></div>
    <span class="itext">${escapeHtml(t.title)}</span>
    <span class="itag ${escapeHtml(t.prio)}">${NAMES[t.prio] || escapeHtml(t.prio)}</span>
    <button class="iconbtn" onclick="del(${t.id})" title="删除" aria-label="删除"><span class="ms">delete</span></button>
  </li>`;
}
function escapeHtml(s){ return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

async function add(){
  const input = document.getElementById("title");
  if (!input.value.trim()) return;
  await fetch("/api/todos", { method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ title: input.value.trim(), prio }) });
  input.value = ""; load();
}
document.getElementById("add").addEventListener("click", add);
document.getElementById("title").addEventListener("keydown", e => { if (e.key === "Enter") add(); });
async function toggle(id, done){ await fetch(`/api/todos/${id}`, { method:"PATCH", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ done }) }); load(); }
async function del(id){ await fetch(`/api/todos/${id}`, { method:"DELETE" }); load(); }
load();
</script>
</body>
</html>
